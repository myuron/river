name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: river
          POSTGRES_PASSWORD: river
          POSTGRES_DB: river
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U river -d river"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      NUXT_DATABASE_URL: postgres://river:river@localhost:5432/river
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Run checks
        run: nix develop --command just ci

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: river
      POSTGRES_PASSWORD: river
      POSTGRES_DB: river
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U river -d river"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
